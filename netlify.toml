[build]
  command = "npm run build && npm run check:dist"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[build.processing]
  skip_processing = true

[context.production.environment]
  SITE_ENV = "production"

[context.deploy-preview.environment]
  SITE_ENV = "preview"

[context.branch-deploy.environment]
  SITE_ENV = "preview"
