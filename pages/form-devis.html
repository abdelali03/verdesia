<div id="formulaire-contact" class="formulaire">
  <form id="quote-form" data-whatsapp-form="devis">
    <div class="grille">
      <h2 class="titre-l">Demande de devis</h2>
      <div class="element ligne_de_texte w-6">
        <label for="nom">Nom *</label>
        <div class="saisie"><input type="text" id="nom" name="nom" autocomplete="family-name" placeholder="Votre nom" required></div>
      </div>
      <div class="element ligne_de_texte w-6">
        <label for="prenom">Prénom *</label>
        <div class="saisie"><input type="text" id="prenom" name="prenom" autocomplete="given-name" placeholder="Votre prénom" required></div>
      </div>
      <div class="element ligne_de_texte w-6">
        <label for="ville">Ville *</label>
        <div class="saisie"><input type="text" id="ville" name="ville" autocomplete="address-level2" placeholder="Votre ville" required></div>
      </div>
      <div class="element email w-6">
        <label for="email">Adresse email (facultatif)</label>
        <div class="saisie"><input type="email" id="email" name="email" autocomplete="email" placeholder="Votre adresse email"></div>
      </div>
      <div class="element telephone">
        <label for="telephone">Numéro de téléphone *</label>
        <div class="saisie"><input type="tel" id="telephone" name="telephone" autocomplete="tel" placeholder="Votre numéro de téléphone" required></div>
      </div>
      <div class="element liste_deroulante mt-xs">
        <label for="service">Votre demande *</label>
        <div class="saisie"><div class="enveloppe-select">
          <select id="service" name="service" required>
            <option value="">Choisissez une prestation</option>
            <option value="creation-jardins">Création et aménagement de jardins</option>
            <option value="reamenagement-jardins">Réaménagement de jardins existants</option>
            <option value="vente-vegetaux">Fourniture et vente de végétaux</option>
            <option value="plantation">Plantation de végétaux</option>
            <option value="terrasses-patios">Aménagement de terrasses et patios</option>
            <option value="arrosage">Installation de systèmes d’arrosage</option>
            <option value="entretien">Entretien des espaces verts</option>
            <option value="eclairage">Éclairage paysager et installation de luminaires</option>
            <option value="pots-jardinieres">Installation de pots et jardinières</option>
          </select>
        </div></div>
      </div>
      <div class="element zone_de_texte">
        <label for="description">Description (facultatif)</label>
        <div class="saisie"><textarea id="description" name="description" rows="6" placeholder="Précisez vos envies, votre espace ou les détails de votre projet…"></textarea></div>
      </div>
      <div class="element bouton mt-xs">
        <button type="submit" class="btn btn-primaire"><span>Envoyer par WhatsApp</span><svg aria-hidden="true" viewBox="0 0 24 18" width="24" height="18"><path d="m14.5 3.5 5.5 5.5-5.5 5.5M3 9h17" fill="none" stroke="currentColor" stroke-width="1.4"/></svg></button>
      </div>
    </div>
    <p class="form-delivery-note">Les champs marqués d’un * sont obligatoires. Vérifiez votre demande, puis envoyez-la à notre équipe sur WhatsApp.</p>
    <div class="mt-s texte-gauche texte-leger" data-contenu><p>Vos coordonnées seront utilisées uniquement pour répondre à votre demande. <button type="button" class="text-link" data-info="privacy">En savoir plus.</button></p></div>
  </form>
</div>
